apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  type: ClusterIP # Sadece K3s iç ağından erişilebilir
  selector:
    app: api-gateway
  ports:
  - port: 80        # Diğer servislerin Gateway'e ulaşacağı port
    targetPort: 3000 # Gateway'in içeride dinlediği gerçek port
    protocol: TCP
