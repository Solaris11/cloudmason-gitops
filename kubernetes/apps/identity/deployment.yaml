apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
      - name: identity-service
        image: egbayram/identity-service:v1.2.0
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "identity-db.infrastructure.svc.cluster.local"
        - name: REDIS_HOST
          value: "session-redis.infrastructure.svc.cluster.local"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: apps
spec:
  selector:
    app: identity-service
  ports:
  - port: 80
    targetPort: 3001
