apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-db
  template:
    metadata:
      labels:
        app: identity-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "sre_user"
        - name: POSTGRES_PASSWORD
          value: "sre_pass"
        - name: POSTGRES_DB
          value: "identity_db"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: identity-db
spec:
  selector:
    app: identity-db
  ports:
  - port: 5432
    targetPort: 5432
