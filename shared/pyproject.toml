[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmason_core"
version = "0.1.0"
description = "Shared core library for the 14 CloudMason microservices and 1 background worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "aio-pika>=9.3.0",
    "asyncpg>=0.29.0",  # For PostgreSQL connections
    "motor>=3.3.0",     # For MongoDB connections
    "redis>=5.0.0"      # For Redis caching
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.11.0",
    "isort>=5.12.0"
]
